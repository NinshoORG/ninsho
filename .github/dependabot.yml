# Dependency updates.
#
# Weekly rather than daily: this repository has few dependencies by design —
# three of the four packages ship with none — so a daily cadence would produce
# noise rather than signal. Grouped so a routine bump is one review, not five.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Everything that only affects how the project is built and tested.
      # A consumer never installs any of it.
      dev-tooling:
        patterns:
          - "typescript"
          - "tsup"
          - "vitest"
          - "rimraf"
          - "@types/*"
          - "esbuild"
        update-types:
          - minor
          - patch
      # The framework packages the adapters are tested against. They are
      # devDependencies of @ninshorg/server only — an adapter that started
      # importing one would fail the bundle-purity gate.
      adapter-frameworks:
        patterns:
          - "express"
          - "fastify"
          - "hono"
          - "koa"
          - "@koa/*"
        update-types:
          - minor
          - patch
    # ioredis is the one runtime dependency a consumer installs, and a major
    # bump changes behaviour the store contract depends on. Kept out of the
    # groups above so it always arrives as its own reviewable pull request.
    ignore:
      # @types/node describes the *oldest* Node this project supports, not the
      # newest. Typing against Node 26 while `engines` says >=22 lets the
      # compiler approve an API that crashes on the floor version — the type
      # check would pass and a Node 22 user would find out at runtime.
      #
      # This was also the one Dependabot PR that kept arriving red (#19, #26):
      # each @types/node major tightens the WebCrypto `BufferSource` typings.
      # Chasing that is the wrong fix. The major moves deliberately, in the
      # same change that raises `engines.node` — see docs/stability.md.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
