name: CI

on:
  push:
    branches: [main]
  pull_request:

# The audit that predecessor project shipped never ran, because `npm ci` failed
# on a desynced lockfile and every later step was skipped. Each job below is
# therefore independent: a failure in one does not silently disable the others.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    # A real Redis, not a mock library. The store contract suite runs the same
    # assertions against MemoryStore and RedisStore, so the two cannot drift
    # apart — if they did, local test runs would stop predicting production
    # behaviour, which is how a revocation bug hides until it matters.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # REGRESSION GATE (audit finding C1)
      # `npm ci` refuses to run against a lockfile that disagrees with the
      # manifests. Keeping it as the first step means a desync fails loudly
      # here instead of silently disabling every gate that follows.
      - name: Install (clean, lockfile-enforced)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # @ninsho/core must be built before the server package's tests can
      # resolve it through the workspace link.
      - name: Build
        run: npm run build

      - name: Test (with real Redis)
        run: npm run test
        env:
          REDIS_URL: redis://localhost:6379

      # PERFORMANCE.md publishes figures these scripts produce, and nothing was
      # running them. `issue()` gained a required field when step-up auth
      # landed, the benchmark kept calling it the old way, and the script threw
      # on its first verify for weeks without anyone noticing — while the
      # numbers it had produced stayed in the documentation looking current.
      #
      # Running them here is not a performance gate. It is a check that the
      # documented figures can still be reproduced by the command the
      # documentation tells you to run.
      - name: Benchmarks still run
        run: |
          npm run bench --workspace @ninsho/server
          npm run bench --workspace @ninsho/webauthn
        env:
          REDIS_URL: redis://localhost:6379

      # Guards against the RedisStore contract silently skipping. The suite is
      # designed to skip without REDIS_URL so it stays runnable locally; that
      # convenience must not quietly turn into "Redis is never tested in CI".
      - name: Assert the Redis contract suite actually ran
        run: |
          npm run test --workspace @ninsho/server -- --reporter=verbose 2>&1 \
            | tee /tmp/test-output.txt
          if ! grep -q "RedisStore" /tmp/test-output.txt; then
            echo "::error::The RedisStore contract suite did not run."
            exit 1
          fi
        env:
          REDIS_URL: redis://localhost:6379

  lockfile:
    name: Lockfile is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Catches the case where a manifest changed but the lockfile was not
      # regenerated — the exact mistake that shipped a broken release before.
      - name: Regenerate lockfile and assert no drift
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json \
            || (echo "::error::package-lock.json is out of sync. Run 'npm install' and commit the result." && exit 1)

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Gated at moderate. One low advisory is currently accepted and tracked:
      # GHSA-g7r4-m6w7-qqqr in esbuild, reachable only through `esbuild serve`,
      # which nothing in this repo invokes — tsup uses esbuild as a bundler API.
      - name: Audit
        run: npm audit --audit-level=moderate

  bundle:
    name: Bundle purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      # REGRESSION GATE (audit finding C2)
      # The predecessor bundled `ioredis-mock` — a devDependency — into its
      # published artifact, and gated the real store behind a USE_REDIS_MOCK
      # environment variable that shipped to production. Both are banned here,
      # and the ban is enforced rather than documented.
      #
      # `MemoryStore` is deliberately NOT on this list. It is a supported
      # export that belongs in the bundle; what made the old mock dangerous was
      # that an environment variable selected it silently. MemoryStore must be
      # named explicitly by the caller and refuses to construct under
      # NODE_ENV=production — enforced by unit test, not by this grep.
      - name: Assert no test doubles or env kill-switches in dist
        run: |
          set -e
          for forbidden in "ioredis-mock" "USE_REDIS_MOCK" "vitest"; do
            if grep -rqF "$forbidden" packages/*/dist/*.js packages/*/dist/*.cjs 2>/dev/null; then
              echo "::error::Forbidden token '$forbidden' found in build output."
              grep -rlF "$forbidden" packages/*/dist/ || true
              exit 1
            fi
          done
          echo "Build output is clean."

      - name: Assert the example builds against the published surface
        run: |
          set -e
          npm run typecheck --workspace @ninsho/example-express-api
          echo "Example type-checks against the built packages."

      # A package that declares files it does not have publishes a blank page
      # on npm, or ships without the licence it claims. Both were live defects
      # here until this gate was added.
      - name: Assert every declared package file exists
        run: |
          set -e
          for pkg in packages/core packages/server packages/client packages/webauthn; do
            for required in README.md LICENSE; do
              if [ ! -f "$pkg/$required" ]; then
                echo "::error::$pkg declares $required in package.json files but it does not exist."
                exit 1
              fi
            done
          done
          npm pack --dry-run --workspace @ninsho/core
          npm pack --dry-run --workspace @ninsho/server
          npm pack --dry-run --workspace @ninsho/client
          npm pack --dry-run --workspace @ninsho/webauthn
          echo "Package contents verified."

      # A dual-format package can type-check inside its own workspace and still
      # fail for an actual consumer: wrong `exports` conditions, a missing
      # .d.cts, an ESM-only construct in the CJS build. The only way to know is
      # to install the tarballs the way npm would and load them both ways.
      - name: Assert the packed tarballs work for a real consumer
        run: |
          set -e
          WORK="$(mktemp -d)"
          npm pack --workspace @ninsho/core     --pack-destination "$WORK"
          npm pack --workspace @ninsho/server   --pack-destination "$WORK"
          npm pack --workspace @ninsho/webauthn --pack-destination "$WORK"

          cd "$WORK"
          cat > package.json <<'JSON'
          {
            "name": "consumer-check", "version": "1.0.0", "type": "module", "private": true,
            "dependencies": {
              "@ninsho/core": "file:./ninsho-core-0.1.0.tgz",
              "@ninsho/server": "file:./ninsho-server-0.1.0.tgz",
              "@ninsho/webauthn": "file:./ninsho-webauthn-0.1.0.tgz"
            }
          }
          JSON
          npm install --no-audit --no-fund

          cat > esm.mjs <<'JS'
          import { Ninsho, MemoryStore } from '@ninsho/server';
          import { generateId } from '@ninsho/core';
          import { WebAuthnServer, importCoseKey, CoseError } from '@ninsho/webauthn';
          import { VirtualAuthenticator } from '@ninsho/webauthn/testing';
          const auth = new Ninsho({ store: new MemoryStore() });
          const pair = await auth.createSession({ userId: 'u', roles: [], scopes: [] });
          const ctx = await auth.engine.verify(pair.accessToken);
          if (ctx.userId !== 'u' || generateId().length !== 22) process.exit(1);
          await auth.close();

          const wa = new WebAuthnServer({
            rpId: 'localhost', rpName: 'X',
            origin: 'https://localhost', store: new MemoryStore(),
          });
          // A malformed key must surface as CoseError, not an unhandled throw.
          await importCoseKey(new Uint8Array([0xff])).then(
            () => process.exit(1),
            (e) => { if (!(e instanceof CoseError)) process.exit(1); },
          );

          // A complete ceremony through the packed artifacts. The /testing
          // subpath resolves differently from a workspace symlink, so it has
          // to be exercised the way a consumer would reach it.
          const device = await VirtualAuthenticator.create();
          const opts = await wa.startRegistration({ userId: 'u1', userName: 'a@b.c' });
          if (opts.attestation !== 'none' || opts.challenge.length !== 43) process.exit(1);
          const reg = await wa.finishRegistration(
            await device.register({
              challenge: Buffer.from(opts.challenge, 'base64url'),
              origin: 'https://localhost', rpId: 'localhost',
            }),
            'u1',
          );
          const aopts = await wa.startAuthentication({ userId: 'u1' });
          const out = await wa.finishAuthentication(
            await device.authenticate({
              challenge: Buffer.from(aopts.challenge, 'base64url'),
              origin: 'https://localhost', rpId: 'localhost',
            }),
            {
              credentialId: reg.credentialId, publicKey: reg.credentialPublicKey,
              signCount: reg.signCount, userId: 'u1',
            },
          );
          if (out.principal.userId !== 'u1' || out.newSignCount !== 1) process.exit(1);
          JS

          cat > cjs.cjs <<'JS'
          const { Ninsho, MemoryStore } = require('@ninsho/server');
          const { generateId } = require('@ninsho/core');
          const { WebAuthnServer } = require('@ninsho/webauthn');
          (async () => {
            const auth = new Ninsho({ store: new MemoryStore() });
            const pair = await auth.createSession({ userId: 'u', roles: [], scopes: [] });
            const ctx = await auth.engine.verify(pair.accessToken);
            if (ctx.userId !== 'u' || generateId().length !== 22) process.exit(1);
            await auth.close();

            const wa = new WebAuthnServer({
              rpId: 'example.com', rpName: 'X',
              origin: 'https://example.com', store: new MemoryStore(),
            });
            if ((await wa.startAuthentication()).rpId !== 'example.com') process.exit(1);
          })().catch((e) => { console.error(e); process.exit(1); });
          JS

          node esm.mjs
          node cjs.cjs
          echo "Both ESM and CJS consumers load the published surface."

      # A test double may ship only if it must be named and cannot be selected
      # by an environment variable. The virtual authenticator holds a private
      # key, so a production import of it would defeat WebAuthn while every
      # signature still verified — a failure with no symptom to notice.
      - name: Assert the virtual authenticator refuses to run in production
        run: |
          set -e
          NODE_ENV=production node -e "
            import('./packages/webauthn/dist/testing.js').then(async (m) => {
              try { await m.VirtualAuthenticator.create(); }
              catch { console.log('Guard holds.'); return; }
              console.error('::error::VirtualAuthenticator constructed under NODE_ENV=production.');
              process.exit(1);
            });
          "

      # It must also stay out of the main entry point, so an application that
      # only imports the verifier never carries it.
      - name: Assert the virtual authenticator is not in the verifier bundle
        run: |
          set -e
          for forbidden in "VirtualAuthenticator" "encodeCbor"; do
            if grep -qF "$forbidden" packages/webauthn/dist/index.js packages/webauthn/dist/index.cjs; then
              echo "::error::'$forbidden' leaked into the @ninsho/webauthn main bundle."
              exit 1
            fi
          done
          echo "Verifier bundle is clean."

      # The Fastify adapter is typed structurally and must stay that way: a
      # real import would make every Express consumer install Fastify.
      - name: Assert the framework adapters carry no framework dependency
        run: |
          set -e
          for adapter in fastify hono; do
            EXTERNAL=$(grep -oE "require\('[^.][^']*'\)" "packages/server/dist/$adapter.cjs" | sort -u || true)
            if [ -n "$EXTERNAL" ]; then
              echo "::error::@ninsho/server/$adapter must import nothing at runtime. Found: $EXTERNAL"
              exit 1
            fi
          done
          if grep -qF "toFastify" packages/server/dist/index.js; then
            echo "::error::The Fastify adapter leaked into the main @ninsho/server bundle."
            exit 1
          fi
          if grep -qF "toHono" packages/server/dist/index.js; then
            echo "::error::The Hono adapter leaked into the main @ninsho/server bundle."
            exit 1
          fi
          echo "Adapters are dependency-free and separate."

      # The client ships to browsers, where every kilobyte and every dependency
      # is the application's problem. It must stay on Web APIs alone.
      - name: Assert the client has no dependencies at all
        run: |
          set -e
          DEPS=$(node -p "JSON.stringify(require('./packages/client/package.json').dependencies || {})")
          if [ "$DEPS" != "{}" ]; then
            echo "::error::@ninsho/client must have no runtime dependencies. Found: $DEPS"
            exit 1
          fi
          echo "Client dependency-free."

      # The verification path for passkeys. A third-party dependency here would
      # sit directly on the code that decides whether a signature is genuine.
      - name: Assert webauthn has no third-party dependencies
        run: |
          set -e
          DEPS=$(node -p "Object.keys(require('./packages/webauthn/package.json').dependencies || {}).filter(d => !d.startsWith('@ninsho/')).join(',')")
          if [ -n "$DEPS" ]; then
            echo "::error::@ninsho/webauthn must depend only on @ninsho/* packages. Found: $DEPS"
            exit 1
          fi
          echo "WebAuthn dependency-free."

      - name: Assert core has no third-party runtime dependencies
        run: |
          set -e
          EXTERNAL=$(grep -oE "require\('[^.][^']*'\)" packages/core/dist/index.cjs | sort -u || true)
          echo "External requires: ${EXTERNAL:-none}"
          if echo "$EXTERNAL" | grep -vqE "^(require\('(node:)?crypto'\))?$"; then
            echo "::error::@ninsho/core must depend only on node:crypto."
            exit 1
          fi
